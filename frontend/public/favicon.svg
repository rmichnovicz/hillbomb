<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Grade gradient: gentle (green) at the top of the hill → extreme (red) at the steep bottom.
         Mirrors GRADE_STOPS in src/utils/gradeColor.ts. -->
    <linearGradient id="grade" x1="14" y1="14" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.32" stop-color="#a3e635"/>
      <stop offset="0.52" stop-color="#facc15"/>
      <stop offset="0.72" stop-color="#fb923c"/>
      <stop offset="0.88" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="fill" x1="32" y1="14" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded tile (matches app background) -->
  <rect width="64" height="64" rx="14" fill="#16171d"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2e303a" stroke-width="1.5"/>

  <!-- Filled area under the descent profile -->
  <path d="M12 16 C 20 17, 24 26, 32 33 C 40 40, 44 49, 53 50 L 53 54 L 12 54 Z" fill="url(#fill)"/>

  <!-- The descent line: an elevation profile bombing downhill -->
  <path d="M12 16 C 20 17, 24 26, 32 33 C 40 40, 44 49, 53 50"
        fill="none" stroke="url(#grade)" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rider: a bright dot streaking down the steep part, with a speed trail -->
  <path d="M37 36.5 L 45.5 44" stroke="#facc15" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
  <circle cx="46.5" cy="44.8" r="4.2" fill="#fff"/>
  <circle cx="46.5" cy="44.8" r="4.2" fill="#fde047" opacity="0.5"/>
</svg>
