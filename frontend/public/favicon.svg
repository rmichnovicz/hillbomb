<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <clipPath id="hill">
      <circle cx="32" cy="61" r="46"/>
    </clipPath>
    <linearGradient id="route" x1="29" y1="22" x2="39" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#facc15"/>
      <stop offset="1" stop-color="#f0436e"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Sky forms the tile, with two deliberately unequal corner clouds. -->
    <rect width="64" height="64" fill="#72c7ed"/>
    <g fill="#f8fbff">
      <circle cx="-1" cy="5" r="6"/>
      <circle cx="6" cy="5" r="5"/>
      <circle cx="11" cy="7" r="4"/>
      <rect x="-4" y="6" width="18" height="5"/>
      <circle cx="65" cy="5" r="4"/>
      <circle cx="59" cy="6" r="3"/>
      <rect x="57" y="6" width="10" height="3"/>
    </g>

    <!-- The round hill dominates the mark. Its quiet second tone adds depth
         without competing with the route at favicon scale. -->
    <circle cx="32" cy="61" r="46" fill="#3f8054"/>
    <path d="M32 15A46 46 0 0 1 78 61V70H32Z" fill="#4f9463"/>

    <!-- The route is hard-clipped to the hill and uses only two grade colors. -->
    <path d="M29 22C43 24 45 30 34 35C21 40 21 46 33 50C40 53 41 57 39 59"
          clip-path="url(#hill)" stroke="url(#route)" stroke-width="6.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
