<!doctype html>
<meta charset="utf-8">
<title>favicon candidates</title>
<style>
  body { font: 13px/1.4 system-ui; margin: 0; background: #e8eaed; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .55;
       margin: 18px 0 8px 16px; }
  /* A Chrome-ish tab strip: this is the only view that matters. */
  .strip { display: flex; align-items: flex-end; gap: 2px; padding: 8px 12px 0;
           background: #dee1e6; }
  .strip.dk { background: #202124; }
  .tab { display: flex; align-items: center; gap: 8px; background: #fff; color: #3c4043;
         border-radius: 10px 10px 0 0; padding: 9px 14px; width: 150px; font-size: 12px;
         white-space: nowrap; overflow: hidden; }
  .dk .tab { background: #35363a; color: #e8eaed; }
  .tab.on { box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
  .ico { width: 16px; height: 16px; flex: 0 0 16px; }
  .row { display: flex; gap: 22px; padding: 10px 16px 16px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 6px; font-size: 11px; opacity: .6; }
  canvas { image-rendering: pixelated; display: block; }
</style>

<h2>Real tab strip &mdash; light</h2>
<div class="strip">
  <div class="tab on"><svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1a73e8"/></svg>Docs</div>
  <div class="tab"><img class="ico" src="c1.svg">Shape F1</div>
  <div class="tab"><img class="ico" src="c2.svg">Shape F2</div>
  <div class="tab"><svg class="ico" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#ea4335"/></svg>Mail</div>
  <div class="tab"><img class="ico" src="c3.svg">Shape F3</div>
  <div class="tab"><img class="ico" src="c4.svg">Shape F4</div>
  <div class="tab"><svg class="ico" viewBox="0 0 16 16"><rect width="16" height="16" rx="8" fill="#34a853"/></svg>Sheet</div>
</div>

<h2>Real tab strip &mdash; dark</h2>
<div class="strip dk">
  <div class="tab on"><svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1a73e8"/></svg>Docs</div>
  <div class="tab"><img class="ico" src="c1.svg">Shape F1</div>
  <div class="tab"><img class="ico" src="c2.svg">Shape F2</div>
  <div class="tab"><svg class="ico" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#ea4335"/></svg>Mail</div>
  <div class="tab"><img class="ico" src="c3.svg">Shape F3</div>
  <div class="tab"><img class="ico" src="c4.svg">Shape F4</div>
  <div class="tab"><svg class="ico" viewBox="0 0 16 16"><rect width="16" height="16" rx="8" fill="#34a853"/></svg>Sheet</div>
</div>

<h2>16px raster, magnified 10&times;</h2>
<div class="row" id="mags"></div>

<h2>At size</h2>
<div class="row">
  <figure><img src="c1.svg" width="32"><figcaption>F1 32</figcaption></figure>
  <figure><img src="c2.svg" width="32"><figcaption>F2 32</figcaption></figure>
  <figure><img src="c3.svg" width="32"><figcaption>F3 32</figcaption></figure>
  <figure><img src="c4.svg" width="32"><figcaption>F4 32</figcaption></figure>
  <figure><img src="c1.svg" width="96"><figcaption>F1 96</figcaption></figure>
  <figure><img src="c2.svg" width="96"><figcaption>F2 96</figcaption></figure>
  <figure><img src="c3.svg" width="96"><figcaption>F3 96</figcaption></figure>
  <figure><img src="c4.svg" width="96"><figcaption>F4 96</figcaption></figure>
</div>

<script>
  const mags = document.getElementById('mags')
  let pending = 4
  for (const [file, label] of [['c1.svg','F1'],['c2.svg','F2'],['c3.svg','F3'],['c4.svg','F4']]) {
    const fig = document.createElement('figure')
    const c = document.createElement('canvas')
    c.width = 16; c.height = 16; c.style.width = '160px'; c.style.height = '160px'
    const cap = document.createElement('figcaption'); cap.textContent = label + ' @16'
    fig.append(c, cap); mags.append(fig)
    const img = new Image()
    img.onload = () => { c.getContext('2d').drawImage(img, 0, 0, 16, 16)
                         if (--pending === 0) document.title = 'candidates ready' }
    img.src = file + '?' + Date.now()
  }
</script>
